name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race ./...
      # Never cached: the test runs a freshly built binary, which the Go test cache cannot track.
      - name: pty smoke
        run: go test -count=1 ./internal/smoke
      - name: search latency guard
        run: go test ./internal/search -run TestSearchLatencySmoke
