name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tool versions match scripts/quality.sh; change them in both places.
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: module tidiness
        run: go mod tidy -diff
      - name: test
        run: go test -race -coverprofile=coverage.out -coverpkg=./... ./...
      # Reported, never gated.
      - name: coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            scripts/coverage.sh coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Never cached: the test runs a freshly built binary, which the Go test cache cannot track.
      - name: pty smoke
        run: go test -count=1 ./internal/smoke
      - name: search latency guard
        run: go test ./internal/search -run TestSearchLatencySmoke
